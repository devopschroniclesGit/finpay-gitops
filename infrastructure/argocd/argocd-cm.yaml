################################################################################
# infrastructure/argocd/argocd-cm.yaml
# Argo CD core configuration
################################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # The URL at which the Argo CD UI is accessible
  url: http://k8s-argocd-argocdin-86f4950dca-445310187.us-east-1.elb.amazonaws.com

  # Application resource tracking — annotation is more reliable than label
  application.instanceLabelKey: argocd.argoproj.io/app-name

  # Repos — public GitOps repo doesn't need credentials
  # For private repos add a Secret with argocd.argoproj.io/secret-type=repository
  repositories: |
    - url: https://github.com/devopschroniclesGit/finpay-gitops
      name: finpay-gitops

  # Health check overrides for custom resources
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs

  # Sync windows — prevent accidental prod syncs on weekends
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      clusters:
      - "*"

  # Diff configuration
  server.rbac.log.enforce.enable: "false"
  timeout.reconciliation: "180s"
  timeout.hard.reconciliation: "0s"
