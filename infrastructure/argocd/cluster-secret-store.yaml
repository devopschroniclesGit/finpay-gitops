################################################################################
# infrastructure/argocd/cluster-secret-store.yaml
# ClusterSecretStore — tells External Secrets Operator where to find secrets.
# Uses IRSA (the ServiceAccount bound to the ESO pod) for authentication.
################################################################################
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1    # Change per environment
      auth:
        jwt:
          serviceAccountRef:
            name:      external-secrets-sa
            namespace: external-secrets
