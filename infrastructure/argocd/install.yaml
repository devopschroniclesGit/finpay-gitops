################################################################################
# infrastructure/argocd/install.yaml
# Bootstrap Argo CD using the official upstream manifests.
# Apply this ONCE manually: kubectl apply -f infrastructure/argocd/install.yaml
# After that, Argo CD manages everything else via GitOps.
################################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
---
# Fetch the official Argo CD install manifest.
# Pin to a specific version for reproducibility.
# Source: https://github.com/argoproj/argo-cd/releases
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-bootstrap-note
  namespace: argocd
data:
  note: |
    Run the following to install Argo CD:
      kubectl create namespace argocd
      kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/install.yaml
    Then apply this repo's configuration:
      kubectl apply -f infrastructure/argocd/argocd-cm.yaml
      kubectl apply -f infrastructure/argocd/argocd-rbac-cm.yaml
      kubectl apply -f projects/
      kubectl apply -f infrastructure/argocd/app-of-apps.yaml
