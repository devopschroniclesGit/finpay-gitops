apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finpay-services
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - finpay
  selector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: [finpay]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
