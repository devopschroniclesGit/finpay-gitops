apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: finpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: notification-service
          image: 150103290775.dkr.ecr.us-east-1.amazonaws.com/finpay-notification:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3004
          envFrom:
            - secretRef:
                name: finpay-api-secret
          env:
            - name: PORT
              value: "3004"
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: notification-service
            - name: RABBITMQ_URL
              value: amqp://finpay:FinPay@RMQ2024%21@rabbitmq.finpay.svc.cluster.local:5672/finpay
            - name: ALERT_EMAIL
              value: github@devopschronicles.com
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
