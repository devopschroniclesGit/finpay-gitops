################################################################################
# apps/finpay-api/base/hpa.yaml
# Horizontal Pod Autoscaler — scales on CPU and memory
################################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finpay-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finpay-api

  # min/max patched per overlay
  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               AverageUtilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type:               AverageUtilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type:          Pods
          value:         2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cool-down before scaling down
      policies:
        - type:          Pods
          value:         1
          periodSeconds: 120
