################################################################################
# apps/finpay-api/base/externalsecret.yaml
# Pulls secrets from AWS Secrets Manager into a Kubernetes Secret.
# Requires External Secrets Operator + a ClusterSecretStore to be installed.
################################################################################
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: finpay-api-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager   # Deployed by infrastructure/argocd app

  target:
    name: finpay-api-secret
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key:      finpay/ENVIRONMENT/api   # ENVIRONMENT patched per overlay
        property: JWT_SECRET

    - secretKey: DATABASE_URL
      remoteRef:
        key:      finpay/ENVIRONMENT/api
        property: DATABASE_URL

    - secretKey: REDIS_URL
      remoteRef:
        key:      finpay/ENVIRONMENT/api
        property: REDIS_URL

    - secretKey: REDIS_AUTH
      remoteRef:
        key:      finpay/ENVIRONMENT/api
        property: REDIS_AUTH
