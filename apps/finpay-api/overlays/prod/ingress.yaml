apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finpay-ingress
  namespace: finpay
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-svc
                port:
                  number: 3001
          - path: /api/v1/accounts
            pathType: Prefix
            backend:
              service:
                name: account-svc
                port:
                  number: 3002
          - path: /api/v1/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-svc
                port:
                  number: 3003
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: auth-svc
                port:
                  number: 3001
