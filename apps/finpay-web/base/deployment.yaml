apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpay-web
  namespace: finpay
  labels:
    app.kubernetes.io/name: finpay-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finpay-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finpay-web
    spec:
      containers:
        - name: finpay-web
          image: 150103290775.dkr.ecr.us-east-1.amazonaws.com/finpay-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finpay-web
  namespace: finpay
spec:
  selector:
    app.kubernetes.io/name: finpay-web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finpay-web
  namespace: finpay
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finpay-web
                port:
                  number: 80
